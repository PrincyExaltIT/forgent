# Terminalizer config for the forgent README demo.
#
# Regenerate the GIF (assumes Node + npx available):
#
#   cd forgent
#   npx -y terminalizer record demo --config demo/demo.yml --command "bash demo/demo-script.sh"
#   npx -y terminalizer render demo --output demo/forgent-demo.gif
#
# On Windows, run from Git Bash / WSL. The script uses POSIX paths.

# Recording settings
cols: 96
rows: 24
repeat: 0
quality: 90
frameDelay: auto
maxIdleTime: 1500

# Cursor + prompt cosmetics
cursorStyle: block
fontFamily: "JetBrains Mono, Fira Code, Cascadia Mono, monospace"
fontSize: 13
lineHeight: 1.1
letterSpacing: 0

# Prompt rendered before each command
command: bash
cwd: null
env:
  # demo-script.sh emits its own coloured prompt — terminalizer's PS1 would be
  # dead anyway since the shell runs non-interactively.
  FORGENT_TIMEOUT_MS: "10000"

theme:
  background: "transparent"
  foreground: "#d4d4d4"
  cursor: "#c7c7c7"
  black: "#000000"
  red: "#e06c75"
  green: "#98c379"
  yellow: "#e5c07b"
  blue: "#61afef"
  magenta: "#c678dd"
  cyan: "#56b6c2"
  white: "#d4d4d4"
  brightBlack: "#5c6370"
  brightRed: "#e06c75"
  brightGreen: "#98c379"
  brightYellow: "#e5c07b"
  brightBlue: "#61afef"
  brightMagenta: "#c678dd"
  brightCyan: "#56b6c2"
  brightWhite: "#ffffff"

# `records` is left out on purpose — it is generated by `terminalizer record`.
# The block below is intentionally absent so re-running record overwrites cleanly.
